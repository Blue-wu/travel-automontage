# travel-vlog.yaml
# 单目的地叙事 Vlog — 最核心的流水线
# Agent 读取此文件，按 stages 顺序调用 tool，用 skill 做品质基准

pipeline:
  name: travel-vlog
  description: "单目的地旅行叙事 Vlog，30-60秒，适配抖音竖屏"
  version: "1.0"

  # 全局变量，可被 stages 中的 {{var}} 引用
  variables:
    destination: "新疆"
    # ★ 创作者填写的真实行程背景（1-3 句），文案活人感的唯一来源
    # 见 skills/travel-copywriting.md §6；留空则文案只能写通用句
    trip_context: ""
    duration: 0  # 0 = 素材驱动模式，自动决定时长
    aspect_ratio: "original"  # original = 保持原素材比例
    resolution: "original"    # original = 保持原素材分辨率
    fps: 0  # 0 = 保持原素材帧率

  stages:
    # ── Stage 1: 趋势研究 ──
    # 分析抖音旅行赛道当前趋势，输出 trend_report.json
    - name: trend_research
      tool: tools.trends.douyin_trend_analyzer.DouyinTrendAnalyzer.analyze_travel_trends
      skill: skills/douyin-travel-format.md
      input:
        niche: "旅行"
        destination: "{{destination}}"
      output: trend_report.json
      output_schema: schemas/trend_report.schema.json
      on_failure: "warn"  # 趋势分析失败不阻塞，用默认 hooks

    # ── Stage 2: 素材检索 ──
    # 获取某目的地全部素材并分类（素材驱动模式）
    - name: asset_retrieval
      tool: tools.retrieve.semantic_asset_retriever.SemanticAssetRetriever.retrieve_all
      input:
        destination: "{{destination}}"
        min_quality: 0.0
      output: candidate_clips.json
      output_schema: schemas/candidate_clips.schema.json
      on_failure: "fatal"

    # ── Stage 3: 剧本生成 ──
    # 结合趋势 + 素材，生成创意剧本
    - name: script_generation
      tool: tools.edit.script_generator.ScriptGenerator.generate
      skill: skills/travel-storytelling.md
      input:
        trend: "{{trend_report}}"
        clips: "{{candidate_clips}}"
        destination: "{{destination}}"
        duration: "{{duration}}"
      output: script.json
      output_schema: schemas/script.schema.json
      depends_on: [trend_research, asset_retrieval]
      on_failure: "fatal"

    # ── Stage 4: 分镜规划 ──
    # 将剧本拆解为分镜表，匹配具体素材
    - name: storyboard
      tool: tools.edit.storyboard_planner.StoryboardPlanner.plan
      skill: skills/travel-pacing.md
      input:
        script: "{{script}}"
        candidate_clips: "{{candidate_clips}}"
      output: storyboard.json
      depends_on: [script_generation]
      on_failure: "fatal"

    # ── Stage 4.5: 配音生成 ──
    # 将剧本旁白合成为中文语音
    - name: voiceover_generation
      tool: tools.audio.voiceover_generator.VoiceoverGenerator.generate
      input:
        script: "{{script}}"
        output_dir: "data/output/voiceover_{{destination}}"
        voice: "yunxi"  # 云希（年轻男声）
      output: voiceover.json
      depends_on: [script_generation]
      on_failure: "warn"  # 配音失败不阻塞，继续生成无声视频

    # ── Stage 5: 剪辑决策 ──
    # 生最终剪辑指令：入点出点、转场、字幕、特效
    - name: edit_decision
      tool: tools.edit.edit_decision_maker.EditDecisionMaker.decide
      skill: skills/travel-pacing.md
      input:
        storyboard: "{{storyboard}}"
        voiceover: "{{voiceover}}"
        output_format:
          width: 0     # 0 = 保持原素材宽度
          height: 0    # 0 = 保持原素材高度
          fps: 0       # 0 = 保持原素材帧率
      output: edit_decision.json
      output_schema: schemas/edit_decision.schema.json
      depends_on: [storyboard, voiceover_generation]
      on_failure: "fatal"

    # ── Stage 5.5: 文案生成 ★ ──
    # 时间线定稿后，由 LLM 一次性生成整条片子的全部字幕。
    # 必须在 edit_decision 之后：字幕要卡镜头时长、要首尾呼应、时序不能矛盾，
    # 这些只有时间线确定后才有完整上下文。
    # 逐镜头独立生成（旧 script_generator 的 random.choice）结构上产生不了呼应。
    - name: copywriting
      tool: tools.edit.copywriter.Copywriter.write
      skill: skills/travel-copywriting.md
      input:
        edit_decision: "{{edit_decision}}"
        brief:
          destination: "{{destination}}"
          # ★ 活人感的唯一来源，必须由创作者填写真实经历，见 skill §6
          trip_context: "{{trip_context}}"
          persona: "克制、不煽情、像跟朋友讲事"
        trip_facts: "{{trip_facts}}"
      output: edit_decision_copy.json
      depends_on: [edit_decision]
      on_failure: "warn"   # 文案失败不阻塞渲染，退回模板字幕

    # ── Stage 6: 渲染合成 ──
    - name: compose
      tool: tools.compose.ffmpeg_composer.FFmpegComposer.compose
      skill: agents_skills/ffmpeg.md
      input:
        edit_decision: "{{edit_decision_copy}}"
        output_path: "data/output/final_{{destination}}.mp4"
      output: final_video.mp4
      depends_on: [copywriting]
      on_failure: "fatal"

    # ── Stage 7: 质量自检 ──
    - name: qa
      tool: tools.qa.quality_reviewer.QualityReviewer.review
      skill: skills/douyin-travel-format.md
      input:
        video_path: "{{final_video}}"
        edit_decision: "{{edit_decision}}"
      output: qa_review.json
      output_schema: schemas/qa_review.schema.json
      gates:
        - slideshow_risk_check    # 防止"假视频"（静态图片轮播）
        - audio_level_check        # 音频电平合规
        - subtitle_presence_check  # 必须有字幕
        - pacing_curve_check        # 动静节奏曲线
      on_failure: "retry"  # QA 不通过则回到 edit_decision 重做
      retry:
        max_attempts: 2
        back_to: edit_decision
      depends_on: [compose]
