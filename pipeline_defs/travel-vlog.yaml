# travel-vlog.yaml
# 单目的地叙事 Vlog — 最核心的流水线
# Agent 读取此文件，按 stages 顺序调用 tool，用 skill 做品质基准

pipeline:
  name: travel-vlog
  description: "单目的地旅行叙事 Vlog，30-60秒，适配抖音竖屏。支持多风格：humor/real/contrast"
  version: "2.0"

  # 全局变量，可被 stages 中的 {{var}} 引用
  variables:
    destination: "新疆"
    # ★ 创作者填写的真实行程背景（1-3 句），文案活人感的唯一来源
    # 见 skills/travel-copywriting.md §6；留空则文案只能写通用句
    trip_context: ""
    # 目标 BPM。抖音热歌多在 100-140，120 是通用起点。
    # 选定具体歌曲后可用该歌 BPM 重新吸附，无需重跑流水线
    bpm: 120
    duration: 0  # 0 = 素材驱动模式，自动决定时长
    aspect_ratio: "original"  # original = 保持原素材比例
    resolution: "original"    # original = 保持原素材分辨率
    fps: 0  # 0 = 保持原素材帧率
    # ── 多风格注入（由 CLI --styles 循环覆盖）──
    style: ""
    style_label: ""
    persona: "克制、不煽情、像跟朋友讲事"
    narrative: ""
    avoid_words: ""
    hook_priority: ""
    device_priority: ""
    tts_voice: "yunjian"
    tts_rate: "-5%"
    # 运行前缀（区分输出文件名/配音目录），默认空则原行为
    run_prefix: ""
    vo_suffix: ""

  stages:
    # ── Stage 1: 趋势研究 ──
    # 分析抖音旅行赛道当前趋势，输出 trend_report.json
    - name: trend_research
      tool: tools.trends.douyin_trend_analyzer.DouyinTrendAnalyzer.analyze_travel_trends
      skill: skills/douyin-travel-format.md
      input:
        niche: "旅行"
        destination: "{{destination}}"
      output: trend_report{{run_prefix}}.json
      output_schema: schemas/trend_report.schema.json
      on_failure: "warn"  # 趋势分析失败不阻塞，用默认 hooks

    # ── Stage 2: 素材检索 ──
    # 获取某目的地全部素材并分类（素材驱动模式）
    - name: asset_retrieval
      tool: tools.retrieve.semantic_asset_retriever.SemanticAssetRetriever.retrieve_all
      input:
        destination: "{{destination}}"
        min_quality: 0.0
      output: candidate_clips{{run_prefix}}.json
      output_schema: schemas/candidate_clips.schema.json
      on_failure: "fatal"

    # ── Stage 3: 剧本生成 ──
    # 结合趋势 + 素材，生成创意剧本（带风格会影响 hook_type 偏好）
    - name: script_generation
      tool: tools.edit.script_generator.ScriptGenerator.generate
      skill: skills/travel-storytelling.md
      input:
        trend: "trend_report{{run_prefix}}"
        clips: "candidate_clips{{run_prefix}}"
        destination: "{{destination}}"
        duration: "{{duration}}"
        style: "{{style}}"
        hook_priority: "{{hook_priority}}"
        narrative: "{{narrative}}"
      output: script{{run_prefix}}.json
      output_schema: schemas/script.schema.json
      depends_on: [trend_research, asset_retrieval]
      on_failure: "fatal"

    # ── Stage 4: 分镜规划 ──
    # 将剧本拆解为分镜表，匹配具体素材
    - name: storyboard
      tool: tools.edit.storyboard_planner.StoryboardPlanner.plan
      skill: skills/travel-pacing.md
      input:
        script: "script{{run_prefix}}"
        candidate_clips: "candidate_clips{{run_prefix}}"
        style: "{{style}}"
      output: storyboard{{run_prefix}}.json
      depends_on: [script_generation]
      on_failure: "fatal"

    # ── Stage 4.5: 配音生成 ──
    # 将剧本旁白合成为中文语音（临时版，copywriting 后会重新生成）
    - name: voiceover_generation
      tool: tools.audio.voiceover_generator.VoiceoverGenerator.generate
      input:
        script: "script{{run_prefix}}"
        output_dir: "data/output/voiceover_{{destination}}{{run_prefix}}"
        voice: "{{tts_voice}}"
        rate: "{{tts_rate}}"
      output: voiceover{{run_prefix}}.json
      depends_on: [script_generation]
      on_failure: "warn"  # 配音失败不阻塞，继续生成无声视频

    # ── Stage 5: 剪辑决策 ──
    # 生最终剪辑指令：入点出点、转场、字幕、特效
    - name: edit_decision
      tool: tools.edit.edit_decision_maker.EditDecisionMaker.decide
      skill: skills/travel-pacing.md
      input:
        storyboard: "storyboard{{run_prefix}}"
        voiceover: "voiceover{{run_prefix}}"
        output_format:
          width: 0     # 0 = 保持原素材宽度 (4K)
          height: 0    # 0 = 保持原素材高度
          fps: 0       # 0 = 保持原素材帧率
      output: edit_decision{{run_prefix}}.json
      output_schema: schemas/edit_decision.schema.json
      depends_on: [storyboard, voiceover_generation]
      on_failure: "fatal"

    # ── Stage 5.4: 节拍网格吸附 ★ ──
    # 把所有切点吸附到 BPM 网格，让「用哪首歌」和「怎么剪」解耦：
    # 不需要曲库、不下载音频、不做 beat 检测，一次吸附即可配上
    # 该 BPM（及其整除/整倍 BPM）的任意歌曲。
    #
    # ⚠️ 必须排在 copywriting 之前 —— 吸附会改变镜头时长，
    #    而字幕字数上限是按时长算的（travel-copywriting.md §5）。
    #
    # 想配别的 BPM 的歌不必重跑流水线，单独跑：
    #   python -m tools.edit.beat_grid -e edit_decision.json -b 128 -o out.json
    - name: beat_grid
      tool: tools.edit.beat_grid.BeatGridSnapper.snap
      input:
        edit_decision: "edit_decision{{run_prefix}}"
        bpm: "{{bpm}}"
        subdivision: 1        # 1=整拍（卡点最实）2=半拍（快剪更灵活）
      output: edit_decision_beat{{run_prefix}}.json
      depends_on: [edit_decision]
      on_failure: "warn"      # 吸附失败不阻塞，退回未吸附的时间线

    # ── Stage 5.5: 文案生成 ★ ──
    # 时间线定稿后，由 LLM 一次性生成整条片子的全部字幕和配音文案。
    # persona / avoid_words / style 由多风格循环注入。
    - name: copywriting
      tool: tools.edit.copywriter.Copywriter.write
      skill: skills/travel-copywriting.md
      input:
        # 吃节拍吸附后的时间线（beat_grid 会改镜头时长，而字幕字数上限按时长算）
        edit_decision: "edit_decision_beat{{run_prefix}}"
        brief:
          destination: "{{destination}}"
          # ★ 活人感的唯一来源，必须由创作者填写真实经历，见 skill §6
          trip_context: "{{trip_context}}"
          style: "{{style}}"
          persona: "{{persona}}"
          avoid: "{{avoid_words}}"
          device_priority: "{{device_priority}}"
        trip_facts: "{{trip_facts}}"
      output: edit_decision_copy{{run_prefix}}.json
      depends_on: [beat_grid]
      on_failure: "warn"   # 文案失败不阻塞渲染，退回模板字幕

    # ── Stage 5.6: 配音重新生成 ★ ──
    # copywriting 阶段重新生成了 narration_text，需要重新合成配音。
    - name: voiceover_regeneration
      tool: tools.audio.voiceover_generator.VoiceoverGenerator.regenerate
      input:
        edit_decision: "edit_decision_copy{{run_prefix}}"
        # ★ 属性访问保留嵌套写法（返回字符串，经 str() 转换安全）
        hook_text: "{{script{{run_prefix}}.hook.text}}"
        output_dir: "data/output/voiceover_{{destination}}{{run_prefix}}"
        voice: "{{tts_voice}}"
        rate: "{{tts_rate}}"
      output: voiceover_copy{{run_prefix}}.json
      depends_on: [copywriting]
      on_failure: "warn"  # 失败不阻塞，用旧配音

    # ── Stage 6: 渲染合成 ──
    - name: compose
      tool: tools.compose.ffmpeg_composer.FFmpegComposer.compose
      skill: agents_skills/ffmpeg.md
      input:
        edit_decision: "edit_decision_copy{{run_prefix}}"
        # ★ 必须显式传入 regenerate 后的新配音（含 segments 时长元数据），
        #   用于 Bottom 字幕与配音逐段同步（单一真源）。
        voiceover: "voiceover_copy{{run_prefix}}"
        output_path: "data/output/final_{{destination}}{{run_prefix}}.mp4"
      output: final_video{{run_prefix}}.mp4
      depends_on: [voiceover_regeneration]
      on_failure: "fatal"

    # ── Stage 7: 质量自检 ──
    - name: qa
      tool: tools.qa.quality_reviewer.QualityReviewer.review
      skill: skills/douyin-travel-format.md
      input:
        video_path: "final_video{{run_prefix}}"
        edit_decision: "edit_decision{{run_prefix}}"
      output: qa_review{{run_prefix}}.json
      output_schema: schemas/qa_review.schema.json
      gates:
        - slideshow_risk_check    # 防止"假视频"（静态图片轮播）
        - audio_level_check        # 音频电平合规
        - subtitle_presence_check  # 必须有字幕
        - pacing_curve_check        # 动静节奏曲线
      on_failure: "retry"  # QA 不通过则回到 edit_decision 重做
      retry:
        max_attempts: 2
        back_to: edit_decision
      depends_on: [compose]
