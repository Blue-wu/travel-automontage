[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "travel-automontage"
version = "0.1.0"
description = "Travel Vlog automatic editing system — Agent-as-orchestrator, YAML pipelines, Markdown skills"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "implus" }]

dependencies = [
    # --- 转码 / 媒体处理 ---
    "ffmpeg-python>=0.2.0",

    # --- 数据 / 存储 ---
    "sqlite-utils>=3.36",
    "pydantic>=2.6",

    # --- 向量 / 语义检索 ---
    "numpy>=1.26",
    # CLIP 可选：按需安装 openai-clip 或 transformers
    # "clip-by-openai>=1.0",
    # "transformers>=4.40",

    # --- 趋势分析 ---
    "httpx>=0.27",
    "beautifulsoup4>=4.12",

    # --- 配置 / YAML ---
    "pyyaml>=6.0",
    "jsonschema>=4.21",

    # --- 日志 / CLI ---
    "rich>=13.7",
    "click>=8.1",
]

[project.optional-dependencies]
remotion = [
    # Remotion 渲染需要 Node.js 环境，此处仅声明 Python 侧调用依赖
]
clip = [
    "torch>=2.2",
    "transformers>=4.40",
    "openai-clip>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.3",
]

[project.scripts]
tam = "tools.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
